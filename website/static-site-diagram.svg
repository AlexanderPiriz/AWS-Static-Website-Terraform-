<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Static site request flow</title>
  <desc>A visitor's browser requests the site from CloudFront, which reads the files from a private S3 bucket. Route 53 DNS is shown as planned.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="679" height="269" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>

  <rect x="40" y="140" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="115" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Visitor</text>
  <text x="115" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Browser</text>

  <rect x="265" y="140" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">CloudFront</text>
  <text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Caches, uses OAC</text>

  <rect x="490" y="140" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="565" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">S3 bucket</text>
  <text x="565" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Private files</text>

  <rect x="265" y="40" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.75" stroke-dasharray="5 4"/>
  <text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Route 53 DNS</text>
  <text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Planned</text>

  <line x1="190" y1="168" x2="263" y2="168" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="415" y1="168" x2="488" y2="168" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="96" x2="340" y2="138" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <text x="340" y="240" text-anchor="middle" font-size="12" fill="#5F5E5A">Solid boxes are built and live. Dashed is planned.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
